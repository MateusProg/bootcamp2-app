        async function getCurrent(idImagem) {
            if (currentData) {
                if (document.getElementById(idImagem).src == currentData.sprites.front_default) {
                    addPkmn(idImagem, null);
                    document.getElementById(idImagem).src = "https://static.vecteezy.com/ti/vetor-gratis/p1/9684280-vector-sinal-do-simbolo-mais-esta-isolado-em-um-fundo-branco-mais-icone-cor-editavel-vetor.jpg"
                } else {
                    addPkmn(idImagem, currentData);
                    document.getElementById(idImagem).src = currentData.sprites.front_default;
                }
            } else {
                addPkmn(idImagem, currentData);
                document.getElementById(idImagem).src = "https://static.vecteezy.com/ti/vetor-gratis/p1/9684280-vector-sinal-do-simbolo-mais-esta-isolado-em-um-fundo-branco-mais-icone-cor-editavel-vetor.jpg"
            }
        }

        async function addPkmn(idImagem, currentData) {
            switch (idImagem) {
                case "img1":
                    pkmn1 = currentData;
                    break;
                case "img2":
                    pkmn2 = currentData;
                    break;
                case "img3":

                    break;
                case "img4":
                    pkmn4 = currentData;
                    break;
                case "img5":
                    pkmn5 = currentData;
                    break;
                case "img6":
                    pkmn6 = currentData;
                    break;
            }
        }

        document.getElementById("pkmn1").addEventListener("click", () => {
            getCurrent("img1");
        });
        document.getElementById("pkmn2").addEventListener("click", () => {
            getCurrent("img2");
        });
        document.getElementById("pkmn3").addEventListener("click", () => {
            getCurrent("img3");
        });
        document.getElementById("pkmn4").addEventListener("click", () => {
            getCurrent("img4");
        });
        document.getElementById("pkmn5").addEventListener("click", () => {
            getCurrent("img5");
        });
        document.getElementById("pkmn6").addEventListener("click", () => {

        });

        document.getElementById("botao-inserir").addEventListener("click", () => {
            const resposta = window.confirm("Você tem certeza de que deseja salvar esse time?");

            if (resposta) salvarTime(pkmn1, pkmn2, pkmn3, pkmn4, pkmn5, pkmn6, document.getElementById("nome-time").value);
        });

        // CREATE — salvar um favorito
        async function salvarTime(pkmn1, pkmn2, pkmn3, pkmn4, pkmn5, pkmn6, nome) {
            const { error } = await supabase.from("PokemonTeams").insert({ pokemon1: pkmn1, pokemon2: pkmn2, pokemon3: pkmn3, pokemon4: pkmn4, pokemon5: pkmn5, pokemon6: pkmn6, name: nome });
            if (error) {
                console.error(error);
                currentData = null;
                document.getElementById("resultado").innerHTML = "<p>Ops! Condições não atendidas!</p>"
            } else {
                currentData = null;
                document.getElementById("resultado").innerHTML = "<p>Time adicionado com sucesso!</p>"
            }
        }

        // READ — listar favoritos
        async function listarFavoritos() {
            const { data, error } = await supabase.from("favoritos").select("*").order("criado_em");
            if (!error) renderizarLista(data);   // funcao sua, que desenha na tela
        }

        // DELETE — remover um favorito
        async function removerFavorito(id) {

            listarFavoritos();
        }
